<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Moduli</title></head>
<body>
<!-- File di rilevamento per Netlify Forms: deve elencare TUTTI i campi del modulo React. Non linkare. -->
<form name="preventivo" data-netlify="true" netlify-honeypot="azienda_web" hidden>
  <input type="hidden" name="form-name" value="preventivo">
  <input name="azienda_web">
  <input name="nome"><input name="cognome"><input type="email" name="email"><input type="tel" name="telefono">
  <select name="prodotto"><option>—</option></select>
  <input name="localita"><textarea name="messaggio"></textarea>
  <input type="checkbox" name="privacy" value="si">
  <input name="lead_id"><input name="origine"><input name="pagina"><input name="versione_modulo">
</form>
</body>
</html>
